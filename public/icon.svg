<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="iconShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="iconCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#080612" />
  <rect width="128" height="128" rx="28" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3" />

  <!-- Shield -->
  <path d="M 64 18 
           L 100 33 
           C 100 70 85 96 64 112 
           C 43 96 28 70 28 33 
           Z" 
        fill="#120e26" 
        stroke="url(#iconShieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Aperture ring -->
  <circle cx="64" cy="60" r="16" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="4 2" />
  <circle cx="64" cy="60" r="12" fill="#1e153f" stroke="url(#iconCoreGrad)" stroke-width="2" />

  <!-- Keyhole -->
  <circle cx="64" cy="57" r="3.2" fill="#ffffff" />
  <polygon points="62.5,58 65.5,58 66.5,66 61.5,66" fill="#ffffff" />

  <!-- Checkmark -->
  <path d="M 54 78 L 62 86 L 76 71" 
        stroke="#10b981" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
