name: PrivaPass CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Compact Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔍 TypeScript Typecheck
        run: npx tsc --noEmit

      - name: 🛡️ Compile & Validate Midnight Compact Contract
        run: |
          echo "Installing Midnight Compact Compiler..."
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0
          compact --version
          
          echo "Compiling canonical priva_pass.compact..."
          mkdir -p contract/managed
          compact compile contract/priva_pass.compact ./contract/managed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Run PrivaPass Test Suite
        run: npm test

      - name: 🏗️ Verify Frontend Build
        run: npm run build
