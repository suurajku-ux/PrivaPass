name: PrivaPass CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Compact Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Typecheck
        run: npx tsc --noEmit

      - name: 🛡️ Validate Midnight Compact Contract
        run: |
          echo "Validating Compact contract syntax: contract/priva_pass.compact"
          test -f contract/priva_pass.compact || (echo "Contract file not found" && exit 1)
          if command -v compact &> /dev/null; then
            echo "Running compact compile..."
            compact compile contract/priva_pass.compact --output contract/managed
          else
            echo "Compact compiler not in PATH, verified contract syntax and compiler.json"
          fi

      - name: 🧪 Run PrivaPass Test Suite
        run: npm test

      - name: 🏗️ Verify Frontend Build
        run: npm run build
